[package]
name = "roead"
description = "Rust port of oead C++ library for common Nintendo formats"
version = "2.0.0"
authors = ["Caleb Smith <c.smith@tuta.io>"]
license = "GPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/NiceneNerd/roead"
keywords = ["Nintendo", "aamp", "byml", "sarc", "yaz0"]
categories = ["game-development", "parsing"]
edition = "2024"
rust-version = "1.88"
exclude = ["/test"]

[dependencies]
almost = { version = "0.2", optional = true, default-features = false }
base64 = { version = "0.22", optional = true, default-features = false, features = ["alloc"] }
binrw = { version = "0.15.2", optional = true, default-features = false, features = ["verbose-backtrace"] }
hashbrown = { version = "0.17", optional = true, default-features = false }
indexmap = { version = "2.2", optional = true, default-features = false }
join_str = { version = "0.1", optional = true }
lexical = { version = "^6.0", optional = true, features = ["power-of-two"] }
lexical-core = { version = "0.8.5", optional = true, features = [
    "write-floats",
] }
parking_lot = { version = "0.12.1", optional = true }
num-integer = { version = "0.1.45", optional = true, default-features = false }
num-traits = { version = "0.2.15", optional = true, default-features = false }
rustc-hash = { version = "2.0", optional = true, default-features = false }
ryml = { version = "0.3.2", optional = true, features = ["std"] }
scc = { version = "2.1", optional = true }
serde = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }
smartstring = { version = "1", optional = true, default-features = false }
thiserror = { version = "2", default-features = false }

[build-dependencies]
rustc_version = "0.4.0"

[dev-dependencies]
jwalk = "0.8.1"
rayon = "1.10"

[features]
default = ["std", "alloc", "aamp", "byml", "sarc", "yaz0"]
# std-only facilities. The YAML machinery (ryml/lexical/base64/parking_lot/
# join_str/scc) is deliberately NOT here: those deps are only referenced by
# `yaml`-gated code, and enabling them with `std` would make them unused
# dependencies whenever `yaml` is off. `SarcWriter` no longer needs serde or
# serde_json (its AGLEnv alignment table is checked in as generated data — see
# src/sarc/aglenv.rs).
std = ["alloc", "binrw?/std", "indexmap?/std", "smartstring?/std", "rustc-hash?/std", "base64?/std"]
# allocator + everything that needs it
alloc = ["smartstring", "indexmap", "rustc-hash", "binrw", "hashbrown"]
aamp = ["almost", "num-traits"]
aamp-names = ["std", "scc"]
byml = ["almost", "num-traits"]
sarc = ["num-integer"]
yaz0 = []
yaml = ["std", "ryml", "lexical", "lexical-core", "base64", "parking_lot", "join_str", "aamp-names", "num-traits"]
with-serde = ["serde", "smartstring/serde", "indexmap/serde"]
binrw = ["dep:binrw"]     # dep alias, kept public because cfgs reference it

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(CHANNEL_NIGHTLY)'] }

[lints.cargo]
unused_dependencies = "allow"
